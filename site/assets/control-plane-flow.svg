<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Enoch control-plane flow</title><desc id="desc">Public-safe diagram showing idea intake, control-plane gates, worker execution, evidence sync, and corpus publication.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.title{font:800 34px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#edf3ff}.small{font:600 17px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#b8c3d9}.tiny{font:600 13px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#93a4c2}.box{fill:rgba(15,23,42,.82);stroke:#334155;stroke-width:1.5}.accent{stroke:url(#a);stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#0f172a;stroke:#475569}.num{font:900 28px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#7dd3fc}.muted{fill:#93a4c2;font:500 14px ui-sans-serif,system-ui,Segoe UI,sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker></defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/><circle cx="170" cy="90" r="170" fill="#7dd3fc" opacity=".11"/><circle cx="1030" cy="330" r="210" fill="#c084fc" opacity=".12"/>
<text x="56" y="70" class="title">Enoch turns autonomous research into auditable state transitions</text>
<g transform="translate(58 145)"><rect class="box" width="185" height="115" rx="20"/><text class="small" x="22" y="38">Idea intake</text><text class="tiny" x="22" y="70">source scans</text><text class="tiny" x="22" y="92">candidate ledger</text></g>
<path class="accent" d="M255 202 H340"/>
<g transform="translate(350 125)"><rect class="box" width="210" height="155" rx="20"/><text class="small" x="22" y="38">Control plane</text><text class="tiny" x="22" y="70">pause + queue state</text><text class="tiny" x="22" y="92">preflight gates</text><text class="tiny" x="22" y="114">single-lane safety</text></g>
<path class="accent" d="M572 202 H660"/>
<g transform="translate(670 145)"><rect class="box" width="185" height="115" rx="20"/><text class="small" x="22" y="38">Worker run</text><text class="tiny" x="22" y="70">process truth</text><text class="tiny" x="22" y="92">telemetry window</text></g>
<path class="accent" d="M867 202 H950"/>
<g transform="translate(960 125)"><rect class="box" width="185" height="155" rx="20"/><text class="small" x="22" y="38">Evidence + corpus</text><text class="tiny" x="22" y="70">run notes</text><text class="tiny" x="22" y="92">claim ledger</text><text class="tiny" x="22" y="114">strict audit</text></g>
<g transform="translate(350 322)"><rect class="pill" width="145" height="42" rx="21"/><text class="num" x="22" y="30">393</text><text class="muted" x="83" y="28">artifacts</text></g><g transform="translate(515 322)"><rect class="pill" width="190" height="42" rx="21"/><text class="num" x="22" y="30">393/393</text><text class="muted" x="130" y="28">strict</text></g><g transform="translate(725 322)"><rect class="pill" width="182" height="42" rx="21"/><text class="num" x="22" y="30">6,381</text><text class="muted" x="105" y="28">signals</text></g>
</svg>
