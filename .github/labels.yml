# GitHub Issue Labels
# Install: gh label create --filename .github/labels.yml
# or use: python3 scripts/sync_labels.py
- name: "P0-critical"
  color: "b60205"
  description: "Critical: system down or data loss"
- name: "P1-high"
  color: "d93f0b"
  description: "High: broken feature with no workaround"
- name: "P2-medium"
  color: "fbca04"
  description: "Medium: broken feature with workaround"
- name: "P3-low"
  color: "0e8a16"
  description: "Low: minor issue, cosmetic, or enhancement"
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "feature"
  color: "0075ca"
  description: "New feature or request"
- name: "chore"
  color: "c5c5c5"
  description: "Maintenance, tooling, or CI changes"
- name: "area:control-plane"
  color: "1d76db"
  description: "Control plane API and state management"
- name: "area:dashboard"
  color: "0e8a16"
  description: "Operator dashboard (V2)"
- name: "area:worker"
  color: "5319e7"
  description: "Worker gate, preflight, and dispatch"
- name: "area:observability"
  color: "bfd4f2"
  description: "Logging, metrics, tracing, and alerting"
- name: "area:database"
  color: "fef2c0"
  description: "Postgres migrations and store layer"
- name: "area:security"
  color: "b60205"
  description: "Security scanning, auth, and secrets"
- name: "area:docs"
  color: "d4c5f9"
  description: "Documentation and AGENTS.md"
