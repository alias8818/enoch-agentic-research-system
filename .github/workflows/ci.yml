name: Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate runtime snapshot links
        run: python3 scripts/validate_runtime_snapshot_links.py
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Ruff correctness checks
        run: uv run ruff check .
      - name: Run Ruff format check
        run: uv run ruff format --check .
      - name: Run Pyright type check
        run: uv run pyright --project pyrightconfig.ci.json --level error
      - name: Run deptry (unused dependencies)
        continue-on-error: true
        run: uv run deptry .
      - name: Run Semgrep report-only Enoch guardrails
        continue-on-error: true
        run: uv run semgrep --config .semgrep/enoch-guardrails.yml --metrics=off --no-git-ignore .
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Run dashboard tests
        working-directory: dashboard
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run lint
      - name: Run dashboard E2E tests
        working-directory: dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check dashboard V2 source/asset pairing
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_dashboard_v2_source_asset_pair.py --base ${{ github.event.pull_request.base.sha }}
      - name: Validate AGENTS.md consistency
        run: python3 scripts/validate_agents_md.py
      - name: Validate LLM agentic harness evaluation
        run: python3 scripts/validate_llm_agentic_harness_evaluation.py
      - name: Validate dashboard V2 committed assets
        run: python3 scripts/validate_dashboard_v2_assets.py --skip-npm-ci
      - name: Run tests with timing
        run: |
          uv run pytest -q -n auto -m "not repo_root" --durations=25 --reruns 2 --reruns-delay 3
          uv run pytest -q -m "repo_root" --durations=10 --reruns 2 --reruns-delay 3
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --verbose --redact --no-banner --no-color
