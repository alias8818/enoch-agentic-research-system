name: Code CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate runtime snapshot links
        run: python3 scripts/validate_runtime_snapshot_links.py
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run Ruff correctness checks
        run: uv run ruff check .
      - name: Run Pyright report-only type check
        continue-on-error: true
        run: uv run pyright --level error
      - name: Run Semgrep report-only Enoch guardrails
        continue-on-error: true
        run: uv run semgrep --config .semgrep/enoch-guardrails.yml --metrics=off --no-git-ignore .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Run dashboard tests
        working-directory: dashboard
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run lint
      - name: Run tests
        run: uv run pytest -q
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --verbose --redact --no-banner --no-color
