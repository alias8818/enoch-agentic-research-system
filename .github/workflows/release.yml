name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "*.md"
      - "VERSION"

permissions:
  contents: write

jobs:
  release:
    name: semantic release
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests before release
        run: |
          uv run pytest -q -n auto -m "not repo_root" --durations=10
      - name: Generate OpenAPI schema
        run: uv run python scripts/generate_openapi_schema.py
      - name: Run semantic release
        id: semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          uv run semantic-release version
          # python-semantic-release writes $GITHUB_OUTPUT when the GitHub HVCS client
          # is active; fall back so the publish step always sees `released`.
          if [ -n "${GITHUB_OUTPUT:-}" ] && ! grep -qE '^released=' "${GITHUB_OUTPUT}"; then
            if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
              echo "released=true" >> "${GITHUB_OUTPUT}"
              echo "tag=$(git describe --exact-match --tags HEAD)" >> "${GITHUB_OUTPUT}"
            else
              echo "released=false" >> "${GITHUB_OUTPUT}"
            fi
          fi
      - name: Validate release metadata
        if: steps.semantic-release.outputs.released == 'true'
        run: uv run python scripts/validate_versioning.py
      - name: Publish release
        if: steps.semantic-release.outputs.released == 'true'
        run: uv run semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
