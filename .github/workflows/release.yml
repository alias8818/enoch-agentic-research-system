name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "*.md"
      - "VERSION"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic release
    if: github.event.pusher.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests before release
        run: |
          uv run pytest -q -n auto -m "not repo_root" --durations=10
      - name: Generate OpenAPI schema
        run: uv run python scripts/generate_openapi_schema.py
      - name: Run semantic release
        id: semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run semantic-release version
          # python-semantic-release writes $GITHUB_OUTPUT when the GitHub HVCS client
          # is active; fall back so the publish step always sees `released`.
          if [ -n "${GITHUB_OUTPUT:-}" ] && ! grep -qE '^released=' "${GITHUB_OUTPUT}"; then
            if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
              echo "released=true" >> "${GITHUB_OUTPUT}"
              echo "tag=$(git describe --exact-match --tags HEAD)" >> "${GITHUB_OUTPUT}"
            else
              echo "released=false" >> "${GITHUB_OUTPUT}"
            fi
          fi
      - name: Validate release metadata
        if: steps.semantic-release.outputs.released == 'true'
        run: uv run python scripts/validate_versioning.py
      - name: Publish release
        if: steps.semantic-release.outputs.released == 'true'
        run: uv run semantic-release publish
        env:
          GH_TOKEN: ${{ github.token }}
