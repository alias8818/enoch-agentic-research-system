name: DAST Scan

on:
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 5 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Start local server
        run: |
          cp config.example.json .local-config.json
          export ENOCH_CONFIG=$PWD/.local-config.json
          uv run uvicorn enoch_control_plane.app:app --host 127.0.0.1 --port 8787 &
          sleep 10
          # Verify server is up
          curl -sf http://127.0.0.1:8787/healthz || exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://127.0.0.1:8787/healthz"
          rules_file_name: ".zap-rules.tsv"
          cmd_options: "-t http://127.0.0.1:8787 -d -I"
          allow_issue_writing: false
      - name: Stop server
        if: always()
        run: pkill -f "uvicorn enoch_control_plane" || true
