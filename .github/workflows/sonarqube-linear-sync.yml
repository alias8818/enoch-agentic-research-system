name: SonarQube Linear Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync open SonarQube issues to Linear
        env:
          SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID }}
          LINEAR_PARENT_ISSUE_ID: ${{ vars.LINEAR_PARENT_ISSUE_ID }}
          LINEAR_LABEL_IDS: ${{ vars.LINEAR_LABEL_IDS }}
        run: uv run python scripts/sync_sonarqube_linear.py --skip-if-unconfigured
