name: Public release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release-integrity:
    name: public-release-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout system repo
        uses: actions/checkout@v6
        with:
          path: enoch-agentic-research-system
      - name: Checkout corpus repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/enoch-ai-research-corpus
          path: enoch-ai-research-corpus
      - name: Checkout promising signals repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/enoch-promising-signals
          path: enoch-promising-signals
      - name: Checkout docs repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/enoch-docs
          path: enoch-docs
      - name: Checkout profile site repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/alias8818.github.io
          path: alias8818.github.io
      - name: Checkout owner profile repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/alias8818
          path: alias8818
      - name: Checkout personal site repo
        uses: actions/checkout@v6
        with:
          repository: alias8818/jeremyblankenship.dev
          path: jeremyblankenship.dev
      - name: Validate runtime snapshot links
        working-directory: enoch-agentic-research-system
        run: |
          python3 scripts/validate_runtime_snapshot_links.py
      - name: Generate fresh manifest without overwriting committed public manifest
        working-directory: enoch-agentic-research-system
        run: |
          python3 scripts/generate_ecosystem_manifest.py --corpus ../enoch-ai-research-corpus --docs ../enoch-docs --promising ../enoch-promising-signals --output /tmp/enoch-ecosystem.generated.json
      - name: Validate committed public release accounting and wording
        working-directory: enoch-agentic-research-system
        run: |
          python3 scripts/validate_public_release.py --system . --corpus ../enoch-ai-research-corpus --docs ../enoch-docs --promising ../enoch-promising-signals --profile ../alias8818.github.io --owner-profile ../alias8818 --personal-site ../jeremyblankenship.dev --generated-manifest /tmp/enoch-ecosystem.generated.json
      - name: Render Supabase corpus import ledger validation SQL
        working-directory: enoch-agentic-research-system
        run: |
          python3 scripts/validate_corpus_import_ledger.py --corpus ../enoch-ai-research-corpus --sql-output /tmp/enoch-corpus-ledger-validate.sql
      - name: Set up Supabase CLI for live corpus ledger drift check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: supabase/setup-cli@a4d563a017eb7e7da097c40c441f85dbdcc4411f
        with:
          version: 2.98.1
      - name: Validate live Supabase corpus import ledger
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        working-directory: enoch-agentic-research-system
        env:
          ENOCH_SUPABASE_DATABASE_URL: ${{ secrets.ENOCH_SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "${ENOCH_SUPABASE_DATABASE_URL:-}" ]; then
            echo "ENOCH_SUPABASE_DATABASE_URL is not configured; skipping live ledger validation."
            exit 0
          fi
          python3 scripts/validate_corpus_import_ledger.py --corpus ../enoch-ai-research-corpus
