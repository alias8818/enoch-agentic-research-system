version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: enoch
      POSTGRES_PASSWORD: enoch_dev
      POSTGRES_DB: enoch_control_plane
    volumes:
      - enoch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enoch -d enoch_control_plane"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  enoch_pgdata:
