[project]
name = "enoch-control-plane"
version = "1.41.84"
description = "Enoch Control Plane for auditable agentic research automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "langgraph>=1.1.10,<2.0.0",
  "psutil>=7.0.0,<8.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11.0,<3.0.0",
  "pyjwt>=2.13.0,<3.0.0",
  "pynvml>=12.0.0,<14.0.0",
  "requests>=2.32.0,<3.0.0",
  "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
  "starlette>=1.3.1,<2.0.0",
  "tenacity>=9.0.0,<10.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enoch_control_plane*"]

[tool.setuptools.package-data]
enoch_control_plane = [
    "control_plane/dashboard_v2/index.html",
    "control_plane/dashboard_v2/assets/*",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.14.0",
    "deptry>=0.23.0",
    "hypothesis>=6.108.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=15.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "schemathesis>=4.17.0",
    "semgrep>=1.144.0",
    "python-semantic-release>=9.21.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Start with high-signal correctness checks only. The repo has known
# historical style debt, so broad F/B/SIM enablement would create churn.
select = ["E9", "F821", "F822", "F823"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "repo_root: touches or archives the repository working tree",
]

[tool.coverage.run]
branch = true
source = ["enoch_control_plane"]
omit = [
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["enoch_control_plane", "scripts"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = false
# Strict mode opt-outs for existing codebase; remove each as types are added.
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"
reportAny = "warning"
reportExplicitAny = "warning"
reportCallInDefaultInitializer = "none"
reportUnnecessaryIsInstance = "none"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportPrivateUsage = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "warning"

[tool.deptry]
# Scripts and deploy are standalone runners, not importable from the main package.
ignore = ["scripts", "deploy"]
per_rule_ignores = { DEP001 = ["dspy", "sync_corpus_import_ledger", "validate_public_release"], DEP002 = ["pyjwt", "uvicorn"], DEP003 = ["yaml"] }
package_module_name_map = { pyjwt = "jwt", pyyaml = "yaml" }

[tool.semantic_release]
assets = ["CHANGELOG.md", "uv.lock"]
build_command = "python3 scripts/sync_release_metadata.py"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["VERSION:version"]
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version}"
branch = "main"
