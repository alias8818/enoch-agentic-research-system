[project]
name = "enoch-control-plane"
version = "0.2.0"
description = "Enoch Control Plane for auditable agentic research automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "langgraph>=1.1.10",
  "psutil>=7.0.0,<8.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11.0,<3.0.0",
  "pynvml>=12.0.0,<14.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enoch_control_plane*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
