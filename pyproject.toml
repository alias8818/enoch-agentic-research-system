[project]
name = "enoch-control-plane"
version = "0.3.0"
description = "Enoch Control Plane for auditable agentic research automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "langgraph>=1.1.10",
  "psutil>=7.0.0,<8.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.11.0,<3.0.0",
  "pynvml>=12.0.0,<14.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enoch_control_plane*"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.14.0",
    "pytest>=9.0.3",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with high-signal correctness checks only. The repo has known
# historical style debt, so broad F/B/SIM enablement would create churn.
select = ["E9", "F821", "F822", "F823"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["enoch_control_plane"]
omit = [
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
