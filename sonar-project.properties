sonar.projectKey=alias8818_enoch-agentic-research-system_6ab334f2-c45e-42db-87ce-a99310229989
sonar.projectName=enoch-agentic-research-system

# Keep Sonar focused on product/runtime code. The repository also contains
# generated dashboards, research artifacts, and fixture-heavy tests that should
# not be treated as production source vulnerabilities or duplication debt.
sonar.sources=enoch_control_plane,scripts,deploy,dashboard/src
sonar.tests=tests,dashboard/src,dashboard/e2e
sonar.test.inclusions=tests/**/*.py,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/e2e/**/*.ts
sonar.exclusions=artifacts/**,enoch_control_plane/control_plane/dashboard_v2/**,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/test-results/**,dashboard/tsconfig.tsbuildinfo,**/__pycache__/**

# Python coverage is generated in .github/workflows/build.yml before scanning.
# Scripts/deploy wrappers and the React dashboard are tracked for issues, but
# are excluded from the Python coverage gate until dedicated coverage reports
# are generated for those surfaces.
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/**,deploy/**,dashboard/src/**,enoch_control_plane/control_plane/dashboard_v2/**

# Exclude known high-churn generated/fixture surfaces from copy-paste debt.
sonar.cpd.exclusions=tests/**,artifacts/**,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,enoch_control_plane/control_plane/dashboard_v2/**,dashboard/src/components/WorkerLanes.tsx,dashboard/src/components/ResearchPage.tsx

# Internal/dev service URLs and placeholders in this research control plane are intentionally http
# (private networking, container-to-container, example configs, or services without public TLS termination).
# These are reviewed and accepted risk for this project.
sonar.issue.ignore.multicriteria=httpInternal
sonar.issue.ignore.multicriteria.httpInternal.ruleKey=python:S5332,typescript:S5332
sonar.issue.ignore.multicriteria.httpInternal.resourceKey=**/*

# Cognitive complexity (python:S3776, typescript:S3776) — method/function level only.
# Production Python/TS: threshold 15 (SonarWay default; mirrored in .vscode SonarLint).
# Do not add total cognitive complexity to the quality gate (scales with repo size).
# Tests: keep S3776 at 15 on scan; triage scenario-heavy helpers as Won't Fix (guideline 20-25).
# Scripts/deploy: refactor toward <=20; control-plane core must stay <=15.
# Policy: docs/sonarqube-cognitive-complexity.md
enoch.cognitiveComplexity.productionThreshold=15
enoch.cognitiveComplexity.scriptGuidelineThreshold=20
enoch.cognitiveComplexity.testGuidelineThreshold=25
enoch.cognitiveComplexity.blockThreshold=25
