sonar.projectKey=alias8818_enoch-agentic-research-system_6ab334f2-c45e-42db-87ce-a99310229989
sonar.projectName=enoch-agentic-research-system

# Keep Sonar focused on product/runtime code. The repository also contains
# generated dashboards, research artifacts, and fixture-heavy tests that should
# not be treated as production source vulnerabilities or duplication debt.
sonar.sources=enoch_control_plane,scripts,deploy,dashboard/src
sonar.tests=tests,dashboard/src,dashboard/e2e
sonar.test.inclusions=tests/**/*.py,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/e2e/**/*.ts
sonar.exclusions=artifacts/**,enoch_control_plane/control_plane/dashboard_v2/**,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,dashboard/test-results/**,dashboard/tsconfig.tsbuildinfo,**/__pycache__/**

# Python coverage is generated in .github/workflows/build.yml before scanning.
# Scripts/deploy wrappers and the React dashboard are tracked for issues, but
# are excluded from the Python coverage gate until dedicated coverage reports
# are generated for those surfaces.
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=scripts/**,deploy/**,dashboard/src/**,enoch_control_plane/control_plane/dashboard_v2/**

# Exclude known high-churn generated/fixture surfaces from copy-paste debt.
sonar.cpd.exclusions=tests/**,artifacts/**,dashboard/src/**/*.test.ts,dashboard/src/**/*.test.tsx,enoch_control_plane/control_plane/dashboard_v2/**
